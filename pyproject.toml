[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudvault-backup"
version = "0.1.0a0"
description = "Experimental encrypted offsite file replication using rclone"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cloudvault = "cloudvault.cli:main"

[tool.setuptools.packages.find]
include = ["cloudvault*"]
